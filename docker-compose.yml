services:
  # ---------- FastAPI + витрина Mini App ----------
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------- Telegram-бот (long polling + SniperEngine) ----------
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m bot.main
    volumes:
      - ./data:/app/data
    # Дожидаемся notifier (FREE-пуши отложены до 45с) перед SIGKILL.
    stop_grace_period: 60s
    depends_on:
      - api
    healthcheck:
      # Бот не слушает порт: жив ли он, проверяем по heartbeat-файлу.
      test: ["CMD", "python", "-m", "bot.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

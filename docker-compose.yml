services:
  # ---------- FastAPI + витрина Mini App ----------
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Telegram-бот (long polling + SniperEngine) ----------
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m bot.main
    volumes:
      - ./data:/app/data
    depends_on:
      - api
